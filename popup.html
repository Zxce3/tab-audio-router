<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<link rel="stylesheet" href="popup.css">
<header>
  <img src="icons/48.png" alt="" width="24" height="24">
  <h1>Tab Audio Router</h1>
  <button id="stopall" class="ghost" aria-label="Stop routing all tabs">Stop all</button>
</header>
<div class="bar">
  <input id="search" type="search" placeholder="Search tabs" aria-label="Search tabs" hidden>
  <label class="toggle"><input type="checkbox" id="all"> Show all tabs</label>
</div>
<div id="msg" role="alert"></div>
<section id="onboard" hidden>
  <h2>Get started</h2>
  <ol>
    <li><b>Grant device access</b> once, so Chrome shows speaker and headphone names. Your microphone is never recorded.</li>
    <li>Open this popup <b>on the tab</b> you want to route.</li>
    <li>Choose an output device. Repeat on other tabs.</li>
  </ol>
  <button id="perm" class="primary">Grant device access</button>
</section>
<main id="tabs" aria-live="polite"></main>
<script src="popup.js"></script>
