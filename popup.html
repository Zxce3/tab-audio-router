<!doctype html>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px system-ui, sans-serif; width: 380px; margin: 0; padding: 10px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .tab { border: 1px solid #8884; border-radius: 8px; padding: 8px; margin-bottom: 8px; }
  .tab.current { border-color: #2563eb; }
  .head { display: flex; gap: 6px; align-items: center; }
  .head img { width: 16px; height: 16px; }
  .title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .row { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
  select { flex: 1; min-width: 0; }
  input[type=range] { width: 90px; }
  #msg { color: #c33; margin: 6px 0; }
  .hint { color: #888; font-size: 12px; }
  button { cursor: pointer; }
</style>
<header>
  <label><input type="checkbox" id="all"> Show all tabs</label>
  <button id="stopall">Stop all</button>
</header>
<div id="msg"></div>
<div id="tabs"></div>
<p class="hint">Highlighted = current tab (only the current tab can start routing).</p>
<p><button id="perm">Grant device access (needed once)</button></p>
<p class="hint">Chrome only shows speaker/headphone names after a microphone permission is granted. The extension never records or listens to your microphone; it is requested and released immediately.</p>
<script src="popup.js"></script>
